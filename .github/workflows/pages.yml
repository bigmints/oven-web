name: Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  pull_request:
  workflow_dispatch:
    inputs:
      preview:
        description: Publish a preview without a desktop download
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate ratings reader
        id: ratings-auth
        continue-on-error: true
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.GA_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GA_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GA_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GA_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly
          create_credentials_file: false
      - name: Refresh community ratings
        continue-on-error: true
        if: steps.ratings-auth.outcome == 'success'
        env:
          GA_ACCESS_TOKEN: ${{ steps.ratings-auth.outputs.access_token }}
        run: node scripts/export-ratings.mjs
      - name: Refresh GitHub stars
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-stars.mjs
      - name: Save catalog statistics snapshot
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/apps.json site/ratings.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh catalog statistics"
            git push origin HEAD:main
          fi
      - run: node scripts/validate-catalog.mjs
      - run: node --test scripts/site.test.mjs scripts/refresh-stars.test.mjs scripts/analytics.test.mjs
      - name: Build
        env:
          SITE_BASE_PATH: /
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          if [ "$PUBLISH" = "true" ] && [ "$PREVIEW" != "true" ]; then
            node scripts/build-site.mjs --release
          else
            node scripts/build-site.mjs
          fi
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site-dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
